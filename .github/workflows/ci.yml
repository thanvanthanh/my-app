name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install project tools
        run: |
          brew install mint
          mint bootstrap

      - name: Generate project and resources
        run: |
          make generate
          make swiftgen

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make test TEST_DESTINATION='platform=iOS Simulator,OS=latest,name=iPhone 16 Pro'
