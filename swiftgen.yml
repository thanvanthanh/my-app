xcassets:
  inputs: [Sources/Resources/Assets iOS.xcassets,
           Sources/Resources/Colors iOS.xcassets]
  outputs:
    - templatePath: config/swiftgen/xcassets-swift6.stencil
      output: Sources/Resources/SwiftGen/Assets.swift

strings:
  - inputs: Sources/Resources/Localizables/en.lproj
    outputs:
        templateName: structured-swift5
        output: Sources/Resources/SwiftGen/Localizables.swift
